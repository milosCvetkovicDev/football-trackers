# vision/requirements-test.lock — the CPU test image's FULL resolved dependency set.
#
# This is the file `Dockerfile`'s `cpu` target installs, so it is CONSUMED rather than aspirational:
# a package that drifts out of it changes the image on the next build, and the build is what CI runs.
#
# Produced by resolving requirements-test.txt inside the image and taking `pip freeze` — every
# version below was actually installed together on linux (2026-08-27), transitive deps included.
# That is why this one is a full freeze while requirements.lock (the CUDA target, which cannot be
# built on this machine) pins direct dependencies only.
#
# REGENERATE after changing requirements-test.txt:
#   docker build --target cpu -t ft-vision-cpu . && docker run --rm ft-vision-cpu pip freeze | sort
#
# opencv-python is 4.x here on purpose (requirements-test.txt bounds it <5) so the suite exercises
# the same major version of the decoder as the images that process footage.

