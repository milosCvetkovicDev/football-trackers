; football-trackers - Player Tracker firmware
; Target: WEMOS Lite ESP32 (LOLIN32 Lite)
;
; Build/flash:  pio run -t upload && pio device monitor
; Arduino IDE alternative: rename src/main.cpp -> tracker.ino,
;   board "WEMOS LOLIN32 Lite", install the 3 libs below via Library Manager.
;
; Secrets / provisioning (ADR-0013 hard gate / ADR-0014):
;   No WiFi PSK or MQTT credential is built into this image. The SAME binary flashes to every
;   device; per-device secrets live in NVS and are set once over serial. After flashing, open
;   `pio device monitor` and run the `enroll` console (the device auto-enters it on first boot
;   when NVS is empty): set ssid / wifipass / player / mqttpass, then `save`. NVS uses the
;   Arduino `Preferences` library, which ships with the arduino framework (no lib_deps entry).
;
; Optional: ESP32 flash encryption (dump-proof a recovered device)
;   NVS keeps secrets out of the repo and the build artifact, but the flash can still be read
;   out over USB/JTAG unless flash encryption is enabled. This is an OPT-IN operator step, NOT
;   enabled here, because it BURNS eFUSES IRREVERSIBLY and can lock out re-flashing / brick a
;   board if done wrong. Do it on a spare device first, and take the exact sdkconfig/espefuse
;   steps from the current Espressif docs (do not copy flags from memory):
;     https://docs.espressif.com/projects/esp-idf/en/latest/esp32/security/flash-encryption.html
;   Use Development mode while iterating (re-flashable); Release mode only for a final unit.

[env:lolin32_lite]
platform      = espressif32
board         = lolin32_lite
framework     = arduino
monitor_speed = 115200
; 460800 (not 921600): 921600 corrupted the flash stream on the prototype's USB-serial chip
; ("Unable to verify flash chip connection"). Drop to 115200 if uploads still fail. See docs/dev/local-bench-runbook.md.
upload_speed  = 460800

lib_deps =
    sparkfun/SparkFun u-blox GNSS Arduino Library@^2.2.27
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0
