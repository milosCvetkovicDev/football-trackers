# football-trackers broker — authenticated, per-device ACLs.
#
# Plaintext MQTT on an ISOLATED field LAN (ADR-0007): the broker is never internet-facing,
# but it is NOT anonymous — every wearable and the server authenticate, and an ACL confines
# each device to its own player topic so it cannot spoof another player.
#
# THIS FILE IS NOW THE DEV BROKER TOO. docker-compose.yml mounts this directory read-only at
# /mosquitto/config, so the bench stack exercises the real auth path on every run instead of the
# anonymous config it used to load (audit §4.6 — an anonymous LAN broker meant any host on the Wi-Fi
# could subscribe to every child's 10 Hz feed, or publish forged telemetry the server would accept,
# server-stamp and persist as authoritative). Create the accounts first:
#
#   ./server/mosquitto/dev-provision.sh          # then: docker compose up -d
#
# The two paths below are CONTAINER paths (this directory, mounted at /mosquitto/config). They used to
# be cwd-relative ("./ft.passwd"), which resolved against whatever directory the broker happened to be
# started from; mosquitto exits rather than starting when it can't find them. Running the broker
# directly on a host instead? Point them at wherever you keep the files.

listener 1883
# Bind to the field LAN interface in production, e.g.: listener 1883 192.168.4.1

allow_anonymous false
password_file /mosquitto/config/ft.passwd
acl_file /mosquitto/config/ft.acl

# Abuse bounds (the server also range-checks payloads; these cap the broker itself).
message_size_limit 1024
max_inflight_messages 40
