# Local/bench MQTT broker for the Docker Compose dev stack.
# LOCAL / ISOLATED-NETWORK USE ONLY: anonymous access is enabled for simplicity — the same posture the
# repo's e2e tests use. The wearable still sends its username/password; the broker just doesn't enforce it
# here. PRODUCTION uses the field AP with per-device auth + ACLs (allow_anonymous false). Never expose this
# broker to the internet.
listener 1883
allow_anonymous true
