# mkdocs config for the documentation site.
#
# docs_dir points at _build/docs, which site/build.py stages — nothing in the repository
# moves to satisfy the site generator. See that script's header for why (the docs guard
# asserts links between the subproject READMEs where they sit).
site_name: football-trackers
site_description: >-
  Real-time GPS tracking for youth football, built end to end — ESP32 firmware,
  MQTT, a Bun/Elysia ingest service and a live coach view. 25 ADRs, a production
  readiness audit, and a privacy posture enforced by CI.
site_url: https://miloscvetkovicdev.github.io/football-trackers/
repo_url: https://github.com/milosCvetkovicDev/football-trackers
repo_name: milosCvetkovicDev/football-trackers
edit_uri: ""

docs_dir: _build/docs
site_dir: _build/site

theme:
  name: material
  language: en
  icon:
    repo: fontawesome/brands/github
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: green
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: green
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        # Class `diagram`, not `mermaid`: Material's own integration claims `.mermaid`,
        # empties the element and renders with a copy it fetches from unpkg at a floating
        # major version. Rendering is left to assets/mermaid-init.js and the pinned build.
        - name: mermaid
          class: diagram
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/milosCvetkovicDev
      name: milosCvetkovicDev on GitHub
  generator: false

extra_css:
  - assets/extra.css

extra_javascript:
  - assets/mermaid.min.js
  - assets/mermaid-init.js

